{% extends "base.html" %}

{% block title %}{{ t.menu_login }}{% endblock %}

{% block main_wrapper %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-lg">
                <div class="card-body p-4 p-md-5">
                    <h3 class="text-center mb-4">{{ t.login_crowd }}</h3>
                    <form action="{{ url_for('auth.login_crowd') }}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">{{ t.id }}</label>
                            <input type="text" class="form-control" id="username" name="username"
                                placeholder="Enter your ID" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">{{ t.password }}</label>
                            <input type="password" class="form-control" id="password" name="password"
                                placeholder="Enter your password" required>
                        </div>
                        <div class="d-grid gap-2 mb-3">
                            <button type="submit" class="btn btn-primary btn-lg">{{ t.login }}</button>
                        </div>
                    </form>
                    <form action="{{ url_for('auth.login_oidc') }}" method="get">
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-secondary btn-lg">{{ t.login_oidc }}</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
