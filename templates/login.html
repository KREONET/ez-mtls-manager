{% extends "base.html" %}

{% block title %}{{ t.menu_login }}{% endblock %}

{% block content %}

<div class="container d-flex justify-content-center m-5">
    <div class="col-md-6">
        <div class="card shadow-lg p-5">
            <h3 class="text-center mb-4">{{ t.login_crowd }}</h3>
            <form action="{{ url_for('auth.login_crowd') }}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">{{ t.id }}</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Enter your ID"
                        required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">{{ t.password }}</label>
                    <input type="password" class="form-control" id="password" name="password"
                        placeholder="Enter your password" required>
                </div>
                <div class="d-grid gap-2 mb-2">
                    <button type="submit" class="btn btn-primary btn-lg">{{ t.login }}</button>
                </div>
            </form>
            <form action="{{ url_for('auth.login_oidc') }}" method="get">
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-secondary btn-lg">{{ t.login_oidc }}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
