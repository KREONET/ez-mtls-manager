{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
<div class="px-4 py-5 my-5 text-center">
    <h1 class="display-5 fw-bold text-body-emphasis">EZ mTLS Manager</h1>
    <div class="col-lg-6 mx-auto">
        <p class="lead mb-4">{{ t.index_desc }}
        </p>
        <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
            {% if current_user.is_authenticated %}
            <a href="{{ url_for('user.cert') }}" class="btn btn-primary btn-lg px-4 gap-3">{{ t.btn_go_my_certs }}</a>
            {% else %}
            <a href="{{ url_for('auth.login_selection') }}" class="btn btn-primary btn-lg px-4 gap-3">{{ t.login }}</a>
            {% endif %}
            <a href="{{ manual_url }}" class="btn btn-outline-secondary btn-lg px-4" target="_blank">{{
                t.btn_read_manual }}</a>
        </div>
    </div>
</div>
{% endblock %}
